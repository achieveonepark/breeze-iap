<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>somiri.dev — AchieveOne Developer Docs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #646cff;
      --brand-light: #747bff;
      --bg: #0f0f0f;
      --bg-card: #1a1a1a;
      --bg-card-hover: #222;
      --border: #2e2e2e;
      --text: #ebebeb;
      --text-muted: #888;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-text {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--brand), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-sep { color: var(--border); font-weight: 300; }
    .logo-sub { font-size: 0.9rem; color: var(--text-muted); }

    main {
      flex: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 80px 32px 60px;
      width: 100%;
    }

    .hero {
      text-align: center;
      margin-bottom: 72px;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 40%, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      display: block;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--brand);
      transform: translateY(-2px);
    }

    .card-icon { font-size: 1.8rem; margin-bottom: 12px; }
    .card-name { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
    .card-desc { font-size: 0.875rem; color: var(--text-muted); line-height: 1.6; }

    .card-badge {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(100, 108, 255, 0.15);
      color: var(--brand-light);
      border: 1px solid rgba(100, 108, 255, 0.3);
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    footer a { color: var(--brand-light); text-decoration: none; }

    @media (max-width: 600px) {
      main { padding: 48px 20px 40px; }
      header { padding: 16px 20px; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo-text">somiri.dev</span>
  <span class="logo-sep">/</span>
  <span class="logo-sub">Developer Docs</span>
</header>

<main>
  <div class="hero">
    <h1>AchieveOne<br>Developer Docs</h1>
    <p>Unity 게임 개발을 위한 오픈소스 라이브러리 레퍼런스 문서 모음입니다.</p>
  </div>

  <p class="section-title">라이브러리</p>
  <div class="grid">

    <a class="card" href="/BreezeIAP/">
      <div class="card-icon">💳</div>
      <div class="card-name">Breeze IAP</div>
      <div class="card-desc">Unity IAP v5.3.0+ 기반의 async/await 결제 래퍼. 콜백 없이 한 줄로 구매 처리.</div>
      <span class="card-badge">v3.0.0</span>
    </a>

    <!-- 추가 프로젝트는 여기에 카드를 추가하세요 -->

  </div>
</main>

<footer>
  <a href="https://github.com/achieveonepark" target="_blank">GitHub @achieveonepark</a>
  &nbsp;·&nbsp; MIT License
</footer>

</body>
</html>
